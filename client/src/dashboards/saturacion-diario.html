<meta charset="utf-8">
<title>Informe Diario de Flota</title>
<style>
  :root{
    --bg:#0c1c26; --panel:#12242f; --panel-2:#0e1e28; --panel-3:#162b37;
    --line:#23353f; --line-2:#2c414d;
    --text:#eef2f5; --muted:#8ba0ab; --muted-2:#667d89;
    --brand:#b27746; --brand-dim:rgba(178,119,70,.13); --brand-line:rgba(178,119,70,.45);
    --info:#26b6d9; --good:#22e39b; --bad:#ff4d67; --amber:#f5a623; --violeta:#9b8cf0;
    --radius:12px;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;line-height:1.45;font-variant-numeric:tabular-nums;}
  .wrap{max-width:1240px;margin:0 auto;padding:22px 20px 50px;}
  .head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:16px;}
  .overline{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--info);margin:0 0 5px;}
  h1{font-size:23px;font-weight:800;letter-spacing:-.02em;margin:0;}
  .sub{font-size:12.5px;color:var(--muted);margin:5px 0 0;max-width:760px;}
  .fuente{font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:6px;}
  .fuente::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--info);box-shadow:0 0 7px 1px rgba(38,182,217,.7);}

  .seccion{display:flex;align-items:center;gap:12px;margin:30px 0 14px;}
  .seccion h2{font-size:18px;font-weight:800;letter-spacing:-.02em;margin:0;white-space:nowrap;}
  .seccion .sd{flex:1;height:1px;background:linear-gradient(90deg,var(--line-2),transparent);}
  .seccion .sr{font-size:11.5px;color:var(--muted-2);font-weight:600;white-space:nowrap;}
  .seccion.motriz h2{color:#8fd7ea;} .seccion.semis h2{color:#8ceec4;}

  .kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:16px;}
  @media(max-width:1000px){ .kpis{grid-template-columns:repeat(2,1fr);} }
  .kpi{background:linear-gradient(160deg,var(--panel) 0%,var(--panel-2) 135%);border:1px solid var(--line);border-radius:11px;padding:14px 15px;}
  .kpi.hero{border-color:var(--brand-line);background:linear-gradient(135deg,var(--brand-dim) 0%,var(--panel) 60%,var(--panel-2) 130%);border-top:3px solid var(--brand);}
  .kpi .kl{font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;line-height:1.35;}
  .kpi .kv{font-size:25px;font-weight:800;letter-spacing:-.03em;line-height:1.05;margin-top:6px;color:#fff;}
  .kpi .kv small{font-size:12.5px;font-weight:700;color:var(--muted);margin-left:2px;}
  .kpi .kv.good{color:var(--good);} .kpi .kv.amber{color:var(--amber);} .kpi .kv.bad{color:var(--bad);} .kpi .kv.info{color:var(--info);}
  .kpi .kd{font-size:11.5px;color:var(--muted);font-weight:600;margin-top:4px;line-height:1.45;}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px 18px;margin-bottom:16px;}
  .panel.mot{border-left:3px solid rgba(38,182,217,.5);} .panel.sem{border-left:3px solid rgba(34,227,155,.45);}
  .panel-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:6px;}
  .panel h3{font-size:15px;font-weight:800;margin:0;}
  .panel .psub{font-size:11.5px;color:var(--muted);margin:0;max-width:620px;}
  .lead{font-size:12.5px;color:var(--muted);margin:6px 0 14px;max-width:860px;}
  .lead b{color:var(--text);}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;}
  .grid2 .panel{margin-bottom:0;}
  @media(max-width:980px){ .grid2{grid-template-columns:1fr;} }

  .cards3{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;}
  .cards2{display:grid;grid-template-columns:repeat(2,1fr);gap:11px;}
  @media(max-width:860px){ .cards3,.cards2{grid-template-columns:1fr;} }
  .card{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:13px 15px;}
  .card .cl{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);line-height:1.35;}
  .card .cv{font-size:23px;font-weight:800;letter-spacing:-.025em;margin-top:5px;}
  .card .cd{font-size:11.5px;color:var(--muted-2);font-weight:600;margin-top:4px;line-height:1.5;}

  .stack{display:flex;height:32px;border-radius:8px;overflow:hidden;border:1px solid var(--line-2);}
  .stack div{display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#08161d;min-width:2px;}
  .lgd{display:flex;flex-wrap:wrap;gap:14px;font-size:11.5px;color:var(--muted);font-weight:600;margin:10px 0 4px;}
  .lgd i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px;}
  .lgd i.ln{width:14px;height:3px;border-radius:2px;vertical-align:3px;}

  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;align-items:center;}
  .chip{appearance:none;background:var(--panel-2);border:1px solid var(--line);color:var(--muted);font:inherit;font-size:12px;font-weight:700;padding:6px 13px;border-radius:999px;cursor:pointer;}
  .chip:hover{color:var(--text);border-color:var(--line-2);}
  .chip.on{background:var(--brand-dim);border-color:var(--brand-line);color:#f0d9c2;}
  .flabel{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted-2);}

  .tscroll{overflow-x:auto;border:1px solid var(--line);border-radius:10px;}
  .tscroll.vh{max-height:400px;overflow-y:auto;}
  table{width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px;white-space:nowrap;}
  thead th{position:sticky;top:0;z-index:2;text-align:right;font-size:10.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);padding:10px 13px;background:var(--panel-2);border-bottom:1px solid var(--line);cursor:pointer;user-select:none;}
  thead th:first-child{text-align:left;} thead th:hover{color:var(--text);}
  thead th .ar{opacity:0;margin-left:4px;font-size:9px;} thead th.sorted{color:#fff;} thead th.sorted .ar{opacity:1;color:var(--brand);}
  tbody td{padding:8px 13px;border-bottom:1px solid var(--line);text-align:right;}
  tbody td:first-child{text-align:left;font-weight:700;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover td{background:rgba(255,255,255,.025);}
  tfoot td{padding:9px 13px;text-align:right;font-weight:800;background:var(--panel-2);border-top:1px solid var(--line-2);}
  tfoot td:first-child{text-align:left;}
  .plate{display:inline-flex;font-family:ui-monospace,Consolas,monospace;font-weight:700;font-size:11.5px;letter-spacing:.07em;color:#fff;background:linear-gradient(180deg,var(--panel-3),var(--panel-2));border:1px solid var(--line-2);border-left:3px solid var(--muted-2);border-radius:6px;padding:3px 9px;}
  .plate.tr{border-left-color:var(--info);} .plate.ch{border-left-color:var(--amber);}
  .plate.se{border-left-color:var(--good);} .plate.ba{border-left-color:var(--violeta);} .plate.fu{border-left-color:var(--bad);}
  .gp{display:inline-flex;padding:2px 9px;border-radius:999px;font-weight:700;font-size:10px;text-transform:uppercase;letter-spacing:.05em;}
  .gp.tr{background:rgba(38,182,217,.13);color:var(--info);} .gp.ch{background:rgba(245,166,35,.13);color:var(--amber);}
  .gp.se{background:rgba(34,227,155,.13);color:var(--good);} .gp.ba{background:rgba(155,140,240,.15);color:var(--violeta);}
  .gp.fu{background:rgba(255,77,103,.13);color:var(--bad);}
  .barcel{position:relative;} .barcel i{position:absolute;left:0;top:0;bottom:0;background:rgba(38,182,217,.14);border-right:2px solid var(--info);}
  .barcel span{position:relative;}

  .bar-row{display:grid;grid-template-columns:170px 1fr 96px;align-items:center;gap:10px;margin-bottom:7px;font-size:12px;}
  .bar-row .bl{color:var(--muted);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .bar-row .bt{height:15px;border-radius:5px;min-width:2px;background:var(--info);}
  .bar-row .bv{text-align:right;font-weight:800;}
  @media(max-width:620px){ .bar-row{grid-template-columns:110px 1fr 70px;} }

  .rec{display:grid;gap:10px;}
  .rec .r{background:var(--panel-2);border:1px solid var(--line);border-left:3px solid var(--brand);border-radius:10px;padding:13px 16px;}
  .rec .r .rt{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:5px;}
  .rec .r .rn{font-size:13.5px;font-weight:800;}
  .rec .r .rq{font-size:12.5px;font-weight:800;color:var(--good);white-space:nowrap;}
  .rec .r p{margin:0;font-size:12.5px;color:var(--muted);}
  .rec .r p b{color:var(--text);}
  .rec .r.a{border-left-color:var(--amber);} .rec .r.a .rq{color:var(--amber);}
  .rec .r.i{border-left-color:var(--info);} .rec .r.i .rq{color:var(--info);}
  .rec .r.b{border-left-color:var(--bad);} .rec .r.b .rq{color:var(--bad);}

  .aviso{border-radius:11px;padding:13px 16px;font-size:12.5px;line-height:1.6;margin-bottom:16px;}
  .aviso.am{background:rgba(245,166,35,.07);border:1px solid rgba(245,166,35,.3);color:#f0d9a8;}
  .aviso.ok{background:rgba(34,227,155,.06);border:1px solid rgba(34,227,155,.26);color:#b6efd6;}
  .aviso b{color:#fff;}
  .emb{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
  @media(max-width:900px){ .emb{grid-template-columns:1fr;} }
  .emb .eh{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px;}
  .emb .et{font-size:14px;font-weight:800;letter-spacing:-.01em;}
  .emb .es{font-size:11.5px;color:var(--muted-2);font-weight:600;}
  .emb .paso{display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);}
  .emb .paso:last-of-type{border-bottom:none;}
  .emb .paso .pl{font-size:12.5px;color:var(--muted);font-weight:600;}
  .emb .paso .pl b{color:var(--text);display:block;font-size:11px;font-weight:600;color:var(--muted-2);margin-top:2px;}
  .emb .paso .pv{font-size:20px;font-weight:800;letter-spacing:-.02em;white-space:nowrap;}
  .emb .paso.total{background:linear-gradient(90deg,rgba(255,255,255,.03),transparent);margin:0 -10px;padding:11px 10px;border-radius:8px;border-bottom:none;}
  .emb .paso.total .pv{font-size:26px;}
  .emb .cinta{display:flex;height:26px;border-radius:7px;overflow:hidden;border:1px solid var(--line-2);margin:12px 0 4px;}
  .emb .cinta div{display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:800;color:#08161d;min-width:2px;}
  .dias-chips{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:16px;}
  .dchip{appearance:none;background:var(--panel-2);border:1px solid var(--line);border-radius:11px;color:var(--muted);
    font:inherit;padding:9px 15px;cursor:pointer;text-align:left;transition:all .12s;min-width:112px;}
  .dchip:hover{border-color:var(--line-2);color:var(--text);}
  .dchip.on{background:var(--brand-dim);border-color:var(--brand-line);color:#f0d9c2;}
  .dchip .dd{font-size:12.5px;font-weight:800;letter-spacing:-.01em;}
  .dchip .dv{font-size:11px;font-weight:600;color:var(--muted-2);margin-top:2px;}
  .dchip.on .dv{color:#d8b898;}
  .parque{background:var(--panel-2);border:1px solid var(--line);border-radius:11px;padding:14px 16px;}
  .parque .ph{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px;}
  .parque .pt{font-size:13.5px;font-weight:800;}
  .parque .pu{font-size:20px;font-weight:800;letter-spacing:-.02em;}
  .parque .fila{display:grid;grid-template-columns:1fr auto;gap:10px;font-size:12px;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.04);}
  .parque .fila:last-of-type{border-bottom:none;}
  .parque .fila span:first-child{color:var(--muted);font-weight:600;}
  .parque .fila span:last-child{font-weight:800;white-space:nowrap;}
  .placas{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
  .blk{margin-top:12px;}
  .blk .bt2{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px;}
  .blk .bd{font-size:11px;color:var(--muted-2);line-height:1.5;}
  .nota{font-size:11.5px;color:var(--muted-2);line-height:1.6;margin-top:12px;border-top:1px dashed var(--line);padding-top:10px;}
  .nota b{color:var(--muted);}
  .tip{position:fixed;z-index:60;pointer-events:none;background:#0e1e28;border:1px solid var(--line-2);border-radius:9px;padding:8px 11px;font-size:12px;line-height:1.5;color:var(--text);white-space:pre-line;box-shadow:0 10px 30px rgba(0,0,0,.55);opacity:0;transform:translateY(5px);transition:opacity .12s;max-width:310px;}
  .tip.show{opacity:1;transform:none;}
</style>

<div class="wrap">
  <header class="head">
    <div>
      <p class="overline">Offal · Logística · Saturación de Flota</p>
      <h1 id="tit">Informe diario</h1>
      <p class="sub">Día por día: qué parque había, qué salió y qué se quedó en planta. En el promedio del período una unidad que no salió en toda la semana desaparece detrás de las que sí salieron; acá no.</p>
    </div>
    <span class="fuente" id="fuente"></span>
  </header>

  <div class="aviso am" id="aviso"></div>

  <section class="kpis" id="kpis"></section>

  <section class="panel">
    <p class="lead" id="inf-lead"></p>
    <div class="tscroll" style="margin-bottom:18px"><table id="tinf"><thead></thead><tbody id="tinf-b"></tbody></table></div>
    <div class="dias-chips" id="inf-chips"></div>
    <div id="inf-det"></div>
  </section>


</div>
<div class="tip" id="tip"></div>

          '<td>'+(h.trae?'<span class="plate '+cls(PADRONG(h.trae))+'">'+esc(h.trae)+'</span>':'—')+'</td>'+
          '<td><span class="gp '+(h.tipo==='dedicado'?'ch':h.tipo==='intercambio'?'tr':'fu')+'">'+h.tipo+'</span></td></tr>').join('')+
        '</tbody></table></div>';
      document.getElementById('inf-det').innerHTML=cab+cols+mov;
    }
  }

  function PADRONG(p){ const u=DATA.unidades.find(x=>x.p===p); return u?u.g:"Semi"; }

  const tip=document.getElementById('tip');
  document.addEventListener('mousemove',e=>{ const el=e.target.closest&&e.target.closest('[data-tip]');
    if(el){ tip.textContent=el.getAttribute('data-tip'); tip.classList.add('show');
      const r=tip.getBoundingClientRect(); let nx=e.clientX+14,ny=e.clientY+14;
      if(nx+r.width>innerWidth-8)nx=e.clientX-r.width-14; if(ny+r.height>innerHeight-8)ny=e.clientY-r.height-14;
      tip.style.left=nx+'px'; tip.style.top=ny+'px'; }
    else if(tip.classList.contains('show')) tip.classList.remove('show'); });

  function alto(){ if(window.parent!==window){ try{ parent.postMessage({tipo:'matriz-alto',alto:document.body.scrollHeight},'*'); }catch(e){} } }
  if(window.parent!==window){ alto(); window.addEventListener('resize',alto); new MutationObserver(alto).observe(document.body,{subtree:true,childList:true}); }

})();
