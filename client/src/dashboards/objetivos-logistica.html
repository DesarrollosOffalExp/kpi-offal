  }
  *{box-sizing:border-box;}

  .wrap{max-width:1240px;margin:0 auto;padding:22px 20px 50px;}
  .head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:16px;}
  .overline{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--brand);margin:0 0 5px;}
  h1{font-size:23px;font-weight:800;letter-spacing:-.02em;margin:0;}
  .sub{font-size:12.5px;color:var(--muted);margin:5px 0 0;max-width:760px;}
  .fuente{font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:6px;}
  .fuente::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--brand);box-shadow:0 0 7px 1px rgba(178,119,70,.7);}

  .aviso{background:rgba(38,182,217,.06);border:1px solid rgba(38,182,217,.26);border-radius:11px;padding:13px 16px;font-size:12.5px;color:#bfe6f2;line-height:1.6;margin-bottom:18px;}
  .aviso b{color:#fff;}

  .cuadro{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-bottom:18px;}
  .tscroll{overflow-x:auto;}
  table{width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px;}
  thead th{text-align:center;font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);padding:11px 10px;background:var(--panel-2);border-bottom:1px solid var(--line-2);white-space:nowrap;}
  thead th.kn{text-align:left;min-width:270px;}
  tbody td{padding:0;border-bottom:1px solid var(--line);text-align:center;}
  tbody tr:last-child td{border-bottom:none;}
  tbody td.kn{text-align:left;padding:13px 14px;background:var(--panel);border-right:1px solid var(--line);min-width:270px;}
  .kt{font-size:13px;font-weight:800;letter-spacing:-.01em;}
  .kd{font-size:11px;color:var(--muted-2);font-weight:600;margin-top:3px;line-height:1.45;max-width:330px;}
  .kn .num{display:inline-flex;align-items:center;justify-content:center;width:19px;height:19px;border-radius:6px;background:var(--brand-dim);color:#f0d9c2;font-size:11px;font-weight:800;margin-right:7px;vertical-align:1px;}

  .celda{appearance:none;background:none;border:none;font:inherit;color:inherit;width:100%;padding:13px 8px;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:2px;transition:background .12s;}
  .celda:hover{background:rgba(255,255,255,.04);}
  .celda.on{background:var(--brand-dim);box-shadow:inset 0 -2px 0 var(--brand);}
  .celda .v{font-size:16px;font-weight:800;letter-spacing:-.02em;}
  .celda .v.good{color:var(--good);} .celda .v.bad{color:var(--bad);} .celda .v.amber{color:var(--amber);} .celda .v.na{color:var(--muted-2);font-weight:600;font-size:13px;}
  .celda .s{font-size:10px;color:var(--muted-2);font-weight:600;line-height:1.25;}
  .celda .p{font-size:9px;font-weight:800;color:var(--amber);letter-spacing:.04em;}

  .det{background:var(--panel);border:1px solid var(--brand-line);border-radius:var(--radius);padding:18px 20px;margin-bottom:18px;}
  .det .dh{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:4px;}
  .det .dt{font-size:16px;font-weight:800;letter-spacing:-.015em;}
  .det .dm{font-size:12px;color:var(--muted);font-weight:600;}
  .det .dq{font-size:32px;font-weight:800;letter-spacing:-.03em;line-height:1;}
  .det .dq small{font-size:15px;font-weight:700;color:var(--muted);}
  .cuenta{background:var(--panel-2);border:1px solid var(--line);border-radius:11px;padding:14px 17px;margin:14px 0;}

  .cuenta .cr{font-size:11.5px;color:var(--muted-2);margin-top:8px;line-height:1.6;}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:12px 0;}

  .fuentes{font-size:11.5px;color:var(--muted-2);line-height:1.7;margin-top:14px;border-top:1px dashed var(--line);padding-top:11px;}

  .plate{display:inline-flex;font-family:ui-monospace,Consolas,monospace;font-weight:700;font-size:11px;letter-spacing:.06em;color:#fff;background:var(--panel-3);border:1px solid var(--line-2);border-left:3px solid var(--info);border-radius:5px;padding:2px 7px;}
  .pill{display:inline-flex;padding:2px 9px;border-radius:999px;font-weight:700;font-size:10.5px;}
  .pill.pro{background:rgba(34,227,155,.14);color:var(--good);}

  .fuera{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--muted-2);border-radius:11px;padding:13px 16px;font-size:12.5px;color:var(--muted);line-height:1.6;}
  .fuera b{color:var(--text);}

  .concl{margin-top:26px;}
  .concl .ch{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
  .concl .ch h2{font-size:18px;font-weight:800;letter-spacing:-.02em;margin:0;white-space:nowrap;}

  .concl .ch .sr{font-size:11.5px;color:var(--muted-2);font-weight:600;white-space:nowrap;}
  .pan{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px 18px;margin-bottom:14px;}

  .idxwrap{border:1px solid var(--line);border-radius:9px;overflow-x:auto;margin:10px 0;}
  .acc2{display:grid;gap:9px;margin-top:6px;}
  .acc2 .a{background:var(--panel-2);border:1px solid var(--line);border-left:3px solid var(--brand);border-radius:10px;padding:12px 15px;}

</style>

        '<b>'+millones(C.contrafactico.aFadeeac)+'</b> que el índice habría permitido: <b style="color:var(--good)">'+millones(C.contrafactico.dif)+' menos</b> ('+n1(C.contrafactico.pct)+' %).':'')+
      ' <b>Acá no está el problema</b>, y conviene saberlo antes de sentarse a renegociar.</p></div>';

    h+='<div class="pan ok"><h3>Internalizar funcionó</h3><p>'+
      'La mezcla pasó de <b>'+n1(pInt.mezcla)+' %</b> a <b>'+n1(uInt.mezcla)+' %</b> de kilos propios. '+
      'Valuando los kilos que efectivamente se corrieron por la brecha de costo unitario de cada mes, el ahorro acumulado es '+
      '<b style="color:var(--good)">'+millones(C.ahorroAcum)+'</b>. '+
      'Los dos costos se miden sobre la misma base de kilos: el del flete sale de su propia hoja y no de dividir el gasto por los kilos de descarga.</p>'+
      '<div class="idxwrap"><table class="idx"><thead><tr><th>Mes</th><th>Mezcla propia</th><th>Kilos movidos</th><th>$/kg propio</th><th>$/kg flete</th><th>Ahorro</th></tr></thead><tbody>'+
      C.interna.map(function(x){
        return '<tr><td>'+MES[x.mes-1]+'</td><td>'+n1(x.mezcla)+' %</td><td>'+n0(x.movidos)+'</td>'+
          '<td>'+n1(x.propioKg)+'</td><td>'+n1(x.fleteKg)+'</td>'+
          '<td style="font-weight:800;color:'+(x.ahorro>=0?'var(--good)':'var(--bad)')+'">'+millones(x.ahorro)+'</td></tr>'; }).join('')+
      '</tbody></table></div></div>';

    h+='<div class="pan mal"><h3>El $/ton descargada está midiendo mal al flete</h3><p>'+
      'El flete aporta <b>'+n1(ptsFlete)+' puntos</b> de la suba, pero no por precio: por <b>denominador</b>. '+
      'El indicador divide <b>todo</b> el gasto de flete por <b>sólo</b> los kilos que entran a planta, y el fletero hace cada vez más trabajo que no es descarga '+
      '—el colgado y el sebo <i>salen</i>, no entran—.</p>'+
      '<div class="idxwrap"><table class="idx"><thead><tr><th>Mes</th><th>Viajes facturados</th><th>Viajes de descarga</th><th>Kg facturados</th><th>Kg de descarga</th><th>No es descarga</th></tr></thead><tbody>'+
      C.denom.map(function(x){
        const col=x.pctFuera>15?'var(--bad)':x.pctFuera>5?'var(--amber)':'var(--muted)';
        return '<tr><td>'+MES[x.mes-1]+'</td><td>'+n0(x.viajesFact)+'</td><td>'+n0(x.viajesDesc)+'</td>'+
          '<td>'+n0(x.kgFact)+'</td><td>'+n0(x.kgDesc)+'</td>'+
          '<td style="font-weight:800;color:'+col+'">'+n1(x.pctFuera)+' %</td></tr>'; }).join('')+
      '</tbody></table></div>'+
      '<p>En '+MES[ini.mes-1]+' el fletero facturaba <b>menos</b> kilos de los que descargaba; en '+MES[ult.mes-1]+', '+
      '<b>'+n1(ult.pctFuera)+' %</b> de sus kilos no entran al denominador. Buena parte de la suba del $/ton es aritmética, no de gestión.</p></div>';

    h+='<div class="pan mal"><h3>El taller es el que más rompe</h3><p>'+
      'Subió <b>'+n1(I.tallerReal)+' %</b> cuando el índice de reparaciones de FADEEAC subió <b>'+n1(I.reparaciones)+' %</b>, '+
      'y aporta <b>'+n1(ptsTaller)+' puntos</b> de los '+n1(C.ton.var)+' que subió el costo. '+
      'Sin un preventivo, el $/ton salta de mes a mes por una causa que nadie anticipa, y las roturas bajan la disponibilidad justo cuando la flota corre al límite.</p>'+
      '<div class="idxwrap"><table class="idx"><thead><tr><th>Rubro</th><th>$/ton en enero</th><th>$/ton en '+C.hasta+'</th><th>Puntos que aporta</th></tr></thead><tbody>'+
      C.aporte.map(function(a){
        const col=a.puntos>5?'var(--bad)':a.puntos>0?'var(--amber)':'var(--good)';
        return '<tr><td>'+a.rubro+'</td><td>'+n0(a.ini)+'</td><td>'+n0(a.fin)+'</td>'+
          '<td style="font-weight:800;color:'+col+'">'+pc(a.puntos)+'</td></tr>'; }).join('')+
      '</tbody></table></div></div>';

    h+='<div class="pan ojo"><h3>El gasoil se compró por encima del mercado</h3><p>'+
      'Nuestro precio pasó de <b>'+pesos(C.gasoil.precioIni)+'</b> a <b>'+pesos(C.gasoil.precioFin)+'</b> por litro: <b>'+n1(I.gasoilNuestro)+' %</b>, '+
      'cuando el precio oficial subió <b>'+n1(I.gasoilOficial)+' %</b>. Sobre <b>'+n0(C.gasoil.litros)+'</b> litros comprados, esa diferencia contra el mercado son '+
      '<b style="color:var(--bad)">'+millones(C.gasoil.sobreOficial)+'</b>. '+
      'Contra el INDEC serían '+millones(C.gasoil.sobreIndec)+', pero el combustible nunca sigue al INDEC y compararlo así no sirve para decidir. '+
      'Es la única parte del costo propio que se despegó.</p></div>';

    const acc=[
      {c:'a4',n:'1 · Arreglar el indicador antes de decidir sobre él',q:n1(ult.pctFuera)+' % fuera del denominador',
       d:'El $/ton descargada mezcla el flete de entrada con el de salida. Hay que separarlos, o cambiar el denominador a toneladas movidas. '+
         'Mientras no se separe, cada viaje de colgado o de sebo que se le da a un fletero <b>empeora el indicador aunque sea la decisión correcta</b>.'},
      {c:'a4',n:'2 · El taller, con un preventivo aunque sea básico',q:pc(ptsTaller)+' del costo',
       d:'Es el rubro que más se despegó de su índice y el que más ruido mete en la medición. Además las roturas bajan la disponibilidad, '+
         'y eso empuja la saturación de una flota que ya corre al límite.'},
      {c:'a2',n:'3 · Revisar cómo se compra el gasoil',q:millones(C.gasoil.sobreOficial)+' contra el mercado',
       d:'No es el precio del combustible: es la diferencia entre lo que pagamos y lo que costaba en el mercado. '+
         'Con '+n0(C.gasoil.litros)+' litros en el período, cada punto porcentual vale plata todos los meses.'},
      {c:'',n:'4 · Seguir internalizando, pero ya cuesta fierro',q:millones(C.ahorroAcum)+' ganados',
       d:'La mezcla ganó '+n1(uInt.mezcla-pInt.mezcla)+' puntos y eso valió '+millones(C.ahorroAcum)+'. '+
         'Pero la motriz ya corre al límite de saturación: cada punto más de mezcla necesita una unidad más. '+
         'La cuenta cierra —la brecha de costo unitario es de '+n1(uInt.brecha)+' $/kg— pero ya no es gratis.'},
      {c:'a3',n:'5 · Cambiar el KPI, no sólo cumplirlo',q:'—',
       d:'Los dos KPI de arriba miden bien pero mueven entre el 6 y el 9 % de los viajes. El número que efectivamente movió la aguja es '+
         '<b>la mezcla global de kilos propios</b>, y no lo sigue ningún objetivo. '+
         'El segundo debería ser <b>la tarifa por ruta contra FADEEAC</b>, que hoy da bien y conviene sostener.'},
    ];
    h+='<div class="pan"><h3>Qué haría, en orden de plata</h3><div class="acc2">'+
      acc.map(function(r){
        return '<div class="a '+r.c+'"><div class="at"><span class="an">'+r.n+'</span><span class="aq">'+r.q+'</span></div><p>'+r.d+'</p></div>'; }).join('')+
      '</div></div>';

    document.getElementById('concl').innerHTML=h;
  }

  function alto(){ if(window.parent!==window){ try{ parent.postMessage({tipo:'matriz-alto',alto:document.body.scrollHeight},'*'); }catch(e){} } }

  document.getElementById('fuente').textContent='Cuadro de '+M.persona+' · año '+M.anio;
  document.getElementById('aviso').innerHTML='Los tres KPI que se pueden medir con el dato que ya existe. '+
    'El cuarto del cuadro —<b>informes de gestión</b>— no se calcula: es un informe que todavía no se levanta a ningún sistema, '+
    'así que ponerle un número sería inventarlo.<br>'+
    'Última carga: hoja de ruta hasta el <b>'+dm(M.hojaRuta.hasta)+'</b>, fletes hasta el <b>'+dm(M.fletes.hasta)+'</b> y ResumenKgs hasta el <b>'+dm(M.ingresos.hasta)+'</b>.';
  document.getElementById('fuera').innerHTML='<b>El cuarto KPI del cuadro queda sin calcular.</b> «INFORMES DE GESTION», con meta de cumplimiento mayor al 70 %, '+
    'necesita que los informes se carguen en algún lado para poder contarlos. Hoy no hay de dónde leerlos, así que la fila se deja vacía en vez de completarla con un supuesto.';

  pintaCuadro();
  pintaDetalle();
  pintaConclusion();

  if(window.parent!==window){ alto(); window.addEventListener('resize',alto); new MutationObserver(alto).observe(document.body,{subtree:true,childList:true}); }
})();
</script>
