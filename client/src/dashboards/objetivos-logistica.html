<meta charset="utf-8">
<title>Seguimiento de KPI · Logística</title>
<style>
  :root{
    --bg:#0c1c26; --panel:#12242f; --panel-2:#0e1e28; --panel-3:#162b37;
    --line:#23353f; --line-2:#2c414d;
    --text:#eef2f5; --muted:#8ba0ab; --muted-2:#667d89;
    --brand:#b27746; --brand-dim:rgba(178,119,70,.13); --brand-line:rgba(178,119,70,.45);
    --info:#26b6d9; --good:#22e39b; --bad:#ff4d67; --amber:#f5a623; --violeta:#9b8cf0;
    --radius:12px;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;line-height:1.45;font-variant-numeric:tabular-nums;}
  .wrap{max-width:1240px;margin:0 auto;padding:22px 20px 50px;}
  .head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:16px;}
  .overline{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--brand);margin:0 0 5px;}
  h1{font-size:23px;font-weight:800;letter-spacing:-.02em;margin:0;}
  .sub{font-size:12.5px;color:var(--muted);margin:5px 0 0;max-width:760px;}
  .fuente{font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:6px;}
  .fuente::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--brand);box-shadow:0 0 7px 1px rgba(178,119,70,.7);}

  .aviso{background:rgba(38,182,217,.06);border:1px solid rgba(38,182,217,.26);border-radius:11px;padding:13px 16px;font-size:12.5px;color:#bfe6f2;line-height:1.6;margin-bottom:18px;}
  .aviso b{color:#fff;}

  .cuadro{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:0;overflow:hidden;margin-bottom:18px;}
  .tscroll{overflow-x:auto;}
  table{width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px;}
  thead th{position:sticky;top:0;z-index:2;text-align:center;font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);padding:11px 10px;background:var(--panel-2);border-bottom:1px solid var(--line-2);white-space:nowrap;}
  thead th.kn{text-align:left;min-width:270px;position:sticky;left:0;z-index:3;}
  tbody td{padding:0;border-bottom:1px solid var(--line);text-align:center;}
  tbody tr:last-child td{border-bottom:none;}
  tbody td.kn{text-align:left;padding:13px 14px;background:var(--panel);position:sticky;left:0;z-index:1;border-right:1px solid var(--line);min-width:270px;}
  .kt{font-size:13px;font-weight:800;letter-spacing:-.01em;}
  .kd{font-size:11px;color:var(--muted-2);font-weight:600;margin-top:3px;line-height:1.45;max-width:330px;}
  .kn .num{display:inline-flex;align-items:center;justify-content:center;width:19px;height:19px;border-radius:6px;background:var(--brand-dim);color:#f0d9c2;font-size:11px;font-weight:800;margin-right:7px;vertical-align:1px;}

  .celda{appearance:none;background:none;border:none;font:inherit;color:inherit;width:100%;padding:13px 8px;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:2px;transition:background .12s;}
  .celda:hover{background:rgba(255,255,255,.04);}
  .celda.on{background:var(--brand-dim);box-shadow:inset 0 -2px 0 var(--brand);}
  .celda .v{font-size:16px;font-weight:800;letter-spacing:-.02em;}
  .celda .v.good{color:var(--good);} .celda .v.bad{color:var(--bad);} .celda .v.amber{color:var(--amber);} .celda .v.na{color:var(--muted-2);font-weight:600;font-size:13px;}
  .celda .s{font-size:10px;color:var(--muted-2);font-weight:600;line-height:1.2;}
  .celda .p{font-size:9px;font-weight:800;color:var(--amber);letter-spacing:.04em;}

  .det{background:var(--panel);border:1px solid var(--brand-line);border-radius:var(--radius);padding:18px 20px;margin-bottom:18px;}
  .det .dh{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:4px;}
  .det .dt{font-size:16px;font-weight:800;letter-spacing:-.015em;}
  .det .dm{font-size:12px;color:var(--muted);font-weight:600;}
  .det .dq{font-size:32px;font-weight:800;letter-spacing:-.03em;line-height:1;}
  .det .dq small{font-size:15px;font-weight:700;color:var(--muted);}
  .cuenta{background:var(--panel-2);border:1px solid var(--line);border-radius:11px;padding:14px 17px;margin:14px 0;}
  .cuenta .cf{font-family:ui-monospace,Consolas,monospace;font-size:13.5px;color:var(--muted);line-height:2;}
  .cuenta .cf b{color:#fff;font-weight:700;}
  .cuenta .cf .op{color:var(--muted-2);margin:0 6px;}
  .cuenta .cr{font-size:11.5px;color:var(--muted-2);margin-top:8px;line-height:1.6;}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:12px 0;}
  .card{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:11px 13px;}
  .card .cl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);line-height:1.3;}
  .card .cv{font-size:20px;font-weight:800;letter-spacing:-.02em;margin-top:4px;}
  .card .cd{font-size:10.5px;color:var(--muted-2);font-weight:600;margin-top:2px;}
  .blk{margin-top:14px;}
  .blk h4{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 7px;}
  .mini{width:100%;border-collapse:separate;border-spacing:0;font-size:12px;}
  .mini th{text-align:right;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--muted-2);padding:6px 10px;background:var(--panel-2);border-bottom:1px solid var(--line);}
  .mini th:first-child{text-align:left;}
  .mini td{padding:6px 10px;border-bottom:1px solid rgba(255,255,255,.045);text-align:right;}
  .mini td:first-child{text-align:left;font-weight:700;}
  .mini tr:last-child td{border-bottom:none;}
  .miniwrap{border:1px solid var(--line);border-radius:9px;overflow:hidden;}
  .fuentes{font-size:11.5px;color:var(--muted-2);line-height:1.7;margin-top:14px;border-top:1px dashed var(--line);padding-top:11px;}
  .fuentes b{color:var(--muted);}
  .plate{display:inline-flex;font-family:ui-monospace,Consolas,monospace;font-weight:700;font-size:11px;letter-spacing:.06em;color:#fff;background:var(--panel-3);border:1px solid var(--line-2);border-left:3px solid var(--info);border-radius:5px;padding:2px 7px;}
  .pill{display:inline-flex;padding:2px 9px;border-radius:999px;font-weight:700;font-size:10.5px;}
  .pill.pro{background:rgba(34,227,155,.14);color:var(--good);} .pill.fle{background:rgba(245,166,35,.14);color:var(--amber);}

  .spark{margin-top:10px;}
  .nota{font-size:11.5px;color:var(--muted-2);line-height:1.6;margin-top:12px;}
  .nota b{color:var(--muted);}
  .fuera{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--muted-2);border-radius:11px;padding:13px 16px;font-size:12.5px;color:var(--muted);line-height:1.6;}
  .fuera b{color:var(--text);}
</style>

<div class="wrap">
  <header class="head">
    <div>
      <p class="overline">Offal · Logística · Objetivo</p>
      <h1>Seguimiento de los KPI asignados</h1>
      <p class="sub">El cuadro del sector dice qué se comprometió; acá está cuánto se cumplió, mes a mes. <b>Cada valor se puede tocar</b> para ver de qué está hecho: el numerador, el denominador y de qué archivo salió cada número.</p>
    </div>
    <span class="fuente" id="fuente"></span>
  </header>

  <div class="aviso" id="aviso"></div>

  <section class="cuadro">
    <div class="tscroll"><table id="tk"><thead id="tk-h"></thead><tbody id="tk-b"></tbody></table></div>
  </section>

  <div id="detalle"></div>

  <div class="fuera" id="fuera"></div>
</div>

  function pintaCuadro(){

  function pintaDetalle(){
    const box=document.getElementById('detalle');
    if(sel.k==null){ box.innerHTML=''; return; }
    const k=K[sel.k], v=k.valores.find(x=>x.mes===sel.m);
    if(!v){ box.innerHTML=''; return; }
    let h='<div class="det"><div class="dh"><div>'+
      '<div class="dt">'+esc(k.titulo)+'</div>'+
      '<div class="dm">'+MES[v.mes-1]+' '+M.anio+(v.parcial?' · <b style="color:var(--amber)">mes incompleto</b>':'')+'</div></div>'+
      '<div class="dq '+color(k,v.valor)+'" style="color:var(--'+({good:'good',bad:'bad',amber:'amber',na:'muted-2'})[color(k,v.valor)]+')">'+
      (v.valor==null?'—':n1(v.valor)+'<small>%</small>')+'</div></div>';

    if(k.n===1||k.n===2){
      h+='<div class="cuenta"><div class="cf">'+
        '<b>'+v.propios+'</b> viaje'+(v.propios===1?'':'s')+' propio'+(v.propios===1?'':'s')+
        '<span class="op">÷</span><b>'+v.total+'</b> viajes en total'+
        '<span class="op">×</span>100<span class="op">=</span><b>'+(v.valor==null?'—':n1(v.valor)+' %')+'</b></div>'+
        '<div class="cr">El total son los <b>'+v.propios+'</b> que hicimos nosotros más los <b>'+v.fleteros+'</b> que hizo un fletero.</div></div>';
      h+='<div class="cards">'+[
        {l:'Viajes propios',v:n0(v.propios),c:'var(--good)'},
        {l:'Viajes de fletero',v:n0(v.fleteros),c:'var(--amber)'},
        {l:'Total del mes',v:n0(v.total),c:'var(--text)'},
      ].concat(
        k.n===1&&v.tarifaFlete?[{l:'Tarifa pagada al fletero',v:$$(v.tarifaFlete),c:'var(--bad)',d:n0(v.kilosFlete)+' kg'}]
        :k.n===2?[
          {l:'Kilos propios',v:n0(v.kilosPropios),c:'var(--good)',d:'de '+n0(v.kilosTotal)+' kg de las dos rutas'},
          {l:'Peso sobre todo el mes',v:n1(v.pesoViajes)+' %',c:'var(--info)',d:v.total+' de '+n0(v.viajesMes)+' viajes de todas las rutas'},
          {l:'Peso en kilos',v:n1(v.pesoKilos)+' %',c:'var(--violeta)',d:n0(v.kilosTotal)+' de '+n0(v.kilosMes)+' kg movidos en el mes'},
        ]:[])
        .map(c=>'<div class="card"><div class="cl">'+c.l+'</div><div class="cv" style="color:'+c.c+'">'+c.v+'</div>'+(c.d?'<div class="cd">'+c.d+'</div>':'')+'</div>').join('')+'</div>';
    }

    if(k.n===1&&v.detallePropios&&v.detallePropios.length){
      h+='<div class="blk"><h4>Los viajes propios, uno por uno</h4><div class="miniwrap"><table class="mini">'+
        '<thead><tr><th>Fecha</th><th>Unidad</th><th>Remito</th><th style="text-align:left">Chofer</th></tr></thead><tbody>'+
        v.detallePropios.map(d=>'<tr><td>'+esc(dm(d.f))+'</td><td><span class="plate">'+esc(d.pat)+'</span></td>'+
        '<td>'+esc(d.rem||'—')+'</td><td style="text-align:left;font-weight:600;color:var(--muted)">'+esc(d.chofer||'—')+'</td></tr>').join('')+
        '</tbody></table></div></div>';
    }
    if(k.n===1&&v.porProveedor&&v.porProveedor.length){
      h+='<div class="blk"><h4>Los que hizo el fletero</h4><div class="miniwrap"><table class="mini">'+
        '<thead><tr><th>Transportista</th><th>Viajes</th></tr></thead><tbody>'+
        v.porProveedor.map(p=>'<tr><td>'+esc(p.k)+'</td><td>'+p.v+'</td></tr>').join('')+'</tbody></table></div></div>';
    }
    if(k.n===2&&v.porRuta){
      h+='<div class="blk"><h4>Abierto por ruta</h4><div class="miniwrap"><table class="mini">'+
        '<thead><tr><th>Ruta</th><th>Propios</th><th>Total</th><th>%</th><th>Kilos</th></tr></thead><tbody>'+
        v.porRuta.map(r=>'<tr><td>'+esc(r.ruta)+'</td><td><span class="pill pro">'+r.propios+'</span></td><td>'+r.total+'</td>'+
        '<td style="font-weight:800">'+(r.total?n1(100*r.propios/r.total):'—')+'%</td><td>'+n0(r.kilos)+'</td></tr>').join('')+
        '</tbody></table></div></div>';
      if(v.porFletero&&v.porFletero.length) h+='<div class="blk"><h4>Los que todavía hace un fletero</h4><div class="miniwrap"><table class="mini">'+
        '<thead><tr><th>Transportista</th><th>Viajes</th></tr></thead><tbody>'+
        v.porFletero.map(p=>'<tr><td>'+esc(p.k)+'</td><td>'+p.v+'</td></tr>').join('')+'</tbody></table></div></div>';
    }

    if(k.n===3){
      h+='<div class="cuenta"><div class="cf">'+
        '<b>'+$$(v.base)+'</b> de '+MES[v.mes-2]+'<span class="op">×</span>(1 + <b>'+n2(v.indec)+' %</b> del INDEC)<span class="op">=</span><b>'+$$(v.ajustado)+'</b><br>'+
        '<b>'+$$(v.real)+'</b> real<span class="op">−</span><b>'+$$(v.ajustado)+'</b> ajustado<span class="op">=</span>'+
        '<b style="color:var(--'+(v.diferencia<=0?'good':'bad')+')">'+(v.diferencia>0?'+':'')+$$(v.diferencia)+'</b>'+
        '<span class="op">→</span><b>'+(v.valor==null?'—':(v.valor>0?'+':'')+n1(v.valor)+' %')+'</b></div>'+
        '<div class="cr">Todo en pesos por tonelada descargada. '+
        (v.valor<=0?'El mes cerró <b>por debajo</b> de lo que la inflación explicaba.':'El mes cerró <b>por encima</b> de lo que la inflación explicaba.')+'</div></div>';
      h+='<div class="cards">'+[
        {l:'Base · '+MES[v.mes-2],v:$$(v.base),c:'var(--muted)'},
        {l:'INDEC del mes',v:n2(v.indec)+' %',c:'var(--info)'},
        {l:'Ajustado por inflación',v:$$(v.ajustado),c:'var(--amber)'},
        {l:'Costo real',v:$$(v.real),c:v.diferencia<=0?'var(--good)':'var(--bad)'},
      ].map(c=>'<div class="card"><div class="cl">'+c.l+'</div><div class="cv" style="color:'+c.c+'">'+c.v+'</div></div>').join('')+'</div>';
    }

    h+='<div class="fuentes"><b>De dónde sale.</b><br>'+k.fuentes.map(f=>'· '+esc(f)).join('<br>')+
      (k.nota?'<br><b>Criterio.</b> '+esc(k.nota):'')+'</div></div>';
    box.innerHTML=h;
  }

  /* ── el KPI que no se mide ── */
  document.getElementById('fuera').innerHTML='<b>El cuarto KPI del cuadro queda sin calcular.</b> «INFORMES DE GESTION», con meta de cumplimiento mayor al 70 %, '+
    'necesita que los informes se carguen en algún lado para poder contarlos. Hoy no hay de dónde leerlos, así que la fila se deja vacía en vez de completarla con un supuesto.';

  pintaCuadro(); pintaDetalle();

  function alto(){ if(window.parent!==window){ try{ parent.postMessage({tipo:'matriz-alto',alto:document.body.scrollHeight},'*'); }catch(e){} } }
  if(window.parent!==window){ alto(); window.addEventListener('resize',alto); new MutationObserver(alto).observe(document.body,{subtree:true,childList:true}); }
})();
</script>
